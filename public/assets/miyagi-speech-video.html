<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miyagi - The Communication Champ</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0e1a;--wall:#141a2e;--amber:#f5a623;--cream:#fff4dc;color-scheme:dark}
@media (prefers-color-scheme: dark){:root{--ink:#0a0e1a}}
html,body{margin:0;height:100%;background:var(--ink)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#frame{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;overflow:hidden;background:var(--ink);font-family:Archivo,Arial,sans-serif}
#cam{position:absolute;inset:0;transform-origin:50% 48%;animation:push 30s ease-in-out infinite}
@keyframes push{0%{transform:scale(1)}92%{transform:scale(1.13)}100%{transform:scale(1.13)}}
svg{display:block;width:100%;height:100%}
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.arm{transform-box:fill-box;transform-origin:100% 0;animation:arm 3.2s ease-in-out infinite}
@keyframes arm{0%,100%{transform:rotate(0)}30%{transform:rotate(-28deg)}60%{transform:rotate(12deg)}}
.beam{animation:beam 6s ease-in-out infinite}
@keyframes beam{0%,100%{opacity:.5}50%{opacity:.8}}
.mote{animation:mote 9s linear infinite}
@keyframes mote{from{transform:translateY(0)}to{transform:translateY(-120px)}}
#cap{position:absolute;left:6%;right:6%;bottom:9%;text-align:center;color:#fff;font-weight:800;font-size:clamp(14px,3.4vw,52px);line-height:1.15;letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.85);opacity:0;transform:translateY(14px);transition:opacity .8s ease,transform .8s ease}
#cap.on{opacity:1;transform:none}
#cap span{background:linear-gradient(transparent 62%,rgba(245,166,35,.85) 62%);padding:0 .15em}
#fade{position:absolute;inset:0;background:#000;pointer-events:none;animation:fade 30s linear infinite}
@keyframes fade{0%{opacity:1}3%{opacity:0}96.5%{opacity:0}100%{opacity:1}}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2%;background:radial-gradient(ellipse at 50% 40%,#1d2646,var(--ink) 70%);opacity:0;transition:opacity 1.2s ease}
#end.on{opacity:1}
#end img{width:36%;border-radius:1.2vw;box-shadow:0 0 90px rgba(245,166,35,.45);transform:scale(.92);transition:transform 2.5s ease}
#end.on img{transform:scale(1)}
#end p{margin:0;color:var(--cream);font-weight:700;font-size:clamp(11px,2vw,30px)}
@media (prefers-reduced-motion:reduce){#cam,.bob,.arm,.beam,.mote{animation:none}}
</style></head><body>

  [16.5,21.5,"Speak up. <span>Someone in this room</span> needs to hear you."],
  [23,27,"Communication builds <span>careers, teams and dreams.</span>"]];
 var cap=document.getElementById("cap"),end=document.getElementById("end");
 function run(){
  lines.forEach(function(l){
   setTimeout(function(){cap.innerHTML=l[2];cap.classList.add("on")},l[0]*1000);
   setTimeout(function(){cap.classList.remove("on")},l[1]*1000);
  });
  setTimeout(function(){end.classList.add("on")},27.6*1000);
  setTimeout(function(){end.classList.remove("on")},29.9*1000);
 }
 run();setInterval(run,30000);
})();
</script></body></html>
